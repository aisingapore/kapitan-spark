name: Build Zeppelin docker images
on:
  release:
    types:
      - released
      
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    strategy:
          matrix:
            include:
              - spark_version: 3.5.1
                hadoop_version: 3.3.4
    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
            
      - name: Build Zeppelin and push to ghcr.io
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          file: ./installer/charts/zeppelin/Dockerfile
          push: true
          tags: ghcr.io/aisingapore/kapitan-spark/zeppelin:${{ github.event.release.tag_name }}-spark${{ matrix.spark_version }}