apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zeppelin.fullname" . }}-sa
  namespace: {{ .Release.Namespace }} 
  labels:
    {{- include "zeppelin.labels" $ | trim | nindent 4 }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "zeppelin.fullname" . }}-role
  namespace: {{ .Release.Namespace }} 
  labels:
    {{- include "zeppelin.labels" $ | trim | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  # custom start, added deletecollection
  verbs: ["create", "get", "update", "patch", "list", "delete", "deletecollection", "watch"]
  # custom end 
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["bind", "create", "get", "update", "patch", "list", "delete", "watch"]
- apiGroups: ['networking.k8s.io']
  resources: ['ingresses', 'ingresses/status']
  verbs: ['*']
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "zeppelin.fullname" . }}-role-binding
  namespace: {{ .Release.Namespace }} 
  labels:
    {{- include "zeppelin.labels" $ | trim | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "zeppelin.fullname" . }}-sa
roleRef:
  kind: Role
  name: {{ include "zeppelin.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io


