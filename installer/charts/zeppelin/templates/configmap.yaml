{{- $hiveMetastoreServiceName := "" }}
{{- $influxServiceName := "" }}
{{- $sparkHistoryServerPVCName := "" }}
{{ if and .Values.global ( .Values.global.isTopLevel) }}
    {{ if .Values.spark.history.eventLog.usePVC}}
        {{- $sparkHistoryServerPVCName = printf "%s-%s" .Release.Name "spark-history-server-event-logs" | trunc 63 | trimSuffix "-" }}
    {{- end -}}
{{ else }}
  {{- $hiveMetastoreNamespace := index .Values "hiveMetastore" "namespace" -}}
  {{ range $index, $service := (lookup "v1" "Service" $hiveMetastoreNamespace "").items }}
      {{ range $element := $service.spec.ports -}}
          {{ range $key, $value := $element -}}
              {{ if and (eq "port" $key) (eq 9083 $value) }}
                  {{- $hiveMetastoreServiceName = $service.metadata.name }}
                  {{ break }}
              {{ end }}
          {{ end }}
      {{ end }}
  {{ end }}
  {{- $influxNamespace := index .Values "influx" "namespace" -}}
  {{ range $index, $service := (lookup "v1" "Service" $influxNamespace "").items }}
      {{ range $element := $service.spec.ports -}}
          {{ range $key, $value := $element -}}
              {{ if and (eq "port" $key) (eq 2003 $value) }}
                  {{- $influxServiceName = $service.metadata.name }}
                  {{ break }}
              {{ end }}
          {{ end }}
      {{ end }}
  {{ end }}
  
  {{- if eq $hiveMetastoreServiceName "" }}
  {{- fail ( printf "Cannot find hive metastore service in namespace: %s, update variable hiveMetastore.namespace in values.yaml" $hiveMetastoreNamespace) }}
  {{- end }}

  {{- if eq $influxServiceName "" }}
  {{- fail ( printf "Cannot find Influx service in namespace: %s, update variable influx.namespace in values.yaml" $influxServiceName) }}
  {{- end }}

  {{ if .Values.spark.history.eventLog.usePVC}}
    {{ range $index, $pvc := (lookup "v1" "PersistentVolumeClaim" .Release.Namespace "").items }}
        {{ if hasSuffix "-event-logs" $pvc.metadata.name }} 
            {{ $sparkHistoryServerPVCName = $pvc.metadata.name }}
            {{ break }}
        {{ end }}
    {{ end }}
    {{- if eq $sparkHistoryServerPVCName "" }}
    {{- fail ( printf "Cannot find PVC used to store Spark History Server's event logs in namespace: %s, set usePVC=false is not using PVC" .Release.Namespace) }}
    {{- end }}
  {{ end }}



{{ end }}

apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "zeppelin.fullname" . }}-conf-map
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "zeppelin.labels" $ | trim | nindent 4 }}
data:
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "zeppelin.fullname" . }}-custom-files
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "zeppelin.labels" $ | trim | nindent 4 }}
data:
  100-interpreter-spec.yaml: |
    {{`
      #
      # Licensed to the Apache Software Foundation (ASF) under one or more
      # contributor license agreements.  See the NOTICE file distributed with
      # this work for additional information regarding copyright ownership.
      # The ASF licenses this file to You under the Apache License, Version 2.0
      # (the "License"); you may not use this file except in compliance with
      # the License.  You may obtain a copy of the License at
      #
      #    http://www.apache.org/licenses/LICENSE-2.0
      #
      # Unless required by applicable law or agreed to in writing, software
      # distributed under the License is distributed on an "AS IS" BASIS,
      # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      # See the License for the specific language governing permissions and
      # limitations under the License.
      #
      kind: Pod
      apiVersion: v1
      metadata:
        namespace: {{zeppelin.k8s.interpreter.namespace}}
        name: {{zeppelin.k8s.interpreter.pod.name}}
        labels:
          app: {{zeppelin.k8s.interpreter.pod.name}}
          interpreterGroupId: {{zeppelin.k8s.interpreter.group.id}}
          interpreterSettingName: {{zeppelin.k8s.interpreter.setting.name}}
          user: {{ zeppelin.k8s.interpreter.user }}
        {% if zeppelin.k8s.server.uid is defined %}
        ownerReferences:
        - apiVersion: v1
          controller: false
          blockOwnerDeletion: false
          kind: Pod
          name: {{zeppelin.k8s.server.pod.name}}
          uid: {{zeppelin.k8s.server.uid}}
        {% endif %}
      spec:
        securityContext:
          fsGroup: 185
          runAsGroup: 185
          runAsNonRoot: true
          runAsUser: 185
          fsGroupChangePolicy: OnRootMismatch
        
        {% if zeppelin.pvc.claimName is defined or zeppelin.history.pvc.claimName is defined %}      
        volumes:
        {% endif %}
        {% if zeppelin.pvc.claimName is defined and zeppelin.pvc.mountPath is defined %}      
           - name: {{ zeppelin.pvc.claimName }}
             persistentVolumeClaim:
                  claimName: {{ zeppelin.pvc.claimName }}
        {% endif %}
        {% if zeppelin.history.pvc.claimName is defined and zeppelin.history.pvc.mountPath is defined %}  
           - name: {{ zeppelin.history.pvc.claimName }}
             persistentVolumeClaim:
                  claimName: {{ zeppelin.history.pvc.claimName }}
        {% endif %}

        serviceAccountName: {{zeppelin.k8s.interpreter.serviceAccount}}
        {% if zeppelin.k8s.interpreter.group.name == "spark" %}
        automountServiceAccountToken: true
        {% else %}
        automountServiceAccountToken: false
        {% endif %}
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        containers:
        - name: {{zeppelin.k8s.interpreter.container.name}}
          securityContext:
            allowPrivilegeEscalation: false 
          {% if zeppelin.pvc.claimName is defined or zeppelin.history.pvc.claimName is defined %}
          volumeMounts:
          {% endif %}
          {% if zeppelin.pvc.claimName is defined and zeppelin.pvc.mountPath is defined %}
               - name: {{ zeppelin.pvc.claimName }}
                 mountPath:  {{ zeppelin.pvc.mountPath }}
          {% endif %}
          {% if zeppelin.history.pvc.claimName is defined and zeppelin.history.pvc.mountPath is defined %}
               - name: {{ zeppelin.history.pvc.claimName }}
                 mountPath:  {{ zeppelin.history.pvc.mountPath }}
          {% endif %}

          image: {{zeppelin.k8s.interpreter.container.image}}
          {% if zeppelin.k8s.interpreter.container.imagePullPolicy is defined %}
          imagePullPolicy: {{zeppelin.k8s.interpreter.container.imagePullPolicy}}
          {% endif %}
          args:
            - "$(ZEPPELIN_HOME)/bin/interpreter.sh"
            - "-d"
            - "$(ZEPPELIN_HOME)/interpreter/{{zeppelin.k8s.interpreter.group.name}}"
            - "-r"
            - "{{zeppelin.k8s.interpreter.rpc.portRange}}"
            - "-c"
            - "{{zeppelin.k8s.server.rpc.service}}"
            - "-p"
            - "{{zeppelin.k8s.server.rpc.portRange}}"
            - "-i"
            - "{{zeppelin.k8s.interpreter.group.id}}"
            - "-l"
            - "{{zeppelin.k8s.interpreter.localRepo}}/{{zeppelin.k8s.interpreter.setting.name}}"
            - "-g"
            - "{{zeppelin.k8s.interpreter.setting.name}}"
          env:
          {% if zeppelin.driver.PYTHONPATH is defined %}   
          - name: PYTHONPATH
            value: "{{zeppelin.driver.PYTHONPATH}}"
          {% endif %}
          {% if zeppelin.driver.PYTHONUSERBASE is defined %}   
          - name: PYTHONUSERBASE
            value: "{{zeppelin.driver.PYTHONUSERBASE}}"
          {% endif %}
        {% for key, value in zeppelin.k8s.envs.items() %}
          - name: {{key}}
            value: {{value}}
        {% endfor %}
        {% if zeppelin.k8s.interpreter.cores is defined and zeppelin.k8s.interpreter.memory is defined %}
          resources:
            requests:
              memory: "{{zeppelin.k8s.interpreter.memory}}"
              cpu: "{{zeppelin.k8s.interpreter.cores}}"
      {# limits.memory is not set because of a potential OOM-Killer. https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#requests-and-limits #}
            limits:
              cpu: "{{zeppelin.k8s.interpreter.cores}}"
              {% if zeppelin.k8s.interpreter.gpu.type is defined and zeppelin.k8s.interpreter.gpu.nums is defined %}
              {{zeppelin.k8s.interpreter.gpu.type}}: "{{zeppelin.k8s.interpreter.gpu.nums}}"
              {% endif %}
        {% else %}
        {% if zeppelin.k8s.interpreter.gpu.type is defined and zeppelin.k8s.interpreter.gpu.nums is defined %}
          resources:
            limits:
              {{zeppelin.k8s.interpreter.gpu.type}}: "{{zeppelin.k8s.interpreter.gpu.nums}}"
        {% endif %}
        {% endif %}
      ---
      kind: Service
      apiVersion: v1
      metadata:
        namespace: {{zeppelin.k8s.interpreter.namespace}}
        name: {{zeppelin.k8s.interpreter.pod.name}}             # keep Service name the same to Pod name.
        {% if zeppelin.k8s.server.uid is defined %}
        ownerReferences:
        - apiVersion: v1
          controller: false
          blockOwnerDeletion: false
          kind: Pod
          name: {{zeppelin.k8s.server.pod.name}}
          uid: {{zeppelin.k8s.server.uid}}
        {% endif %}
      spec:
        clusterIP: None
        ports:
          - name: intp
            port: 12321
          {% if zeppelin.k8s.interpreter.group.name == "spark" %}
          - name: spark-driver
            port: 22321
          - name: spark-blockmanager
            port: 22322
          - name: spark-ui
            port: 4040
          {% endif %}
        selector:
          app: {{zeppelin.k8s.interpreter.pod.name}}
      {% if zeppelin.k8s.interpreter.group.name == "spark" %}
      ---
      kind: Role
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: {{zeppelin.k8s.interpreter.pod.name}}
        namespace: {{zeppelin.k8s.interpreter.namespace}}
        {% if zeppelin.k8s.server.uid is defined %}
        ownerReferences:
        - apiVersion: v1
          controller: false
          blockOwnerDeletion: false
          kind: Pod
          name: {{zeppelin.k8s.server.pod.name}}
          uid: {{zeppelin.k8s.server.uid}}
        {% endif %}
      rules:
      - apiGroups: [""]
        resources: ["pods", "services", "configmaps"]
        verbs: ["create", "get", "update", "list", "delete", "watch" ]
      ---
      kind: RoleBinding
      apiVersion: rbac.authorization.k8s.io/v1
      metadata:
        name: {{zeppelin.k8s.interpreter.pod.name}}
        namespace: {{zeppelin.k8s.interpreter.namespace}}
        {% if zeppelin.k8s.server.uid is defined %}
        ownerReferences:
        - apiVersion: v1
          controller: false
          blockOwnerDeletion: false
          kind: Pod
          name: {{zeppelin.k8s.server.pod.name}}
          uid: {{zeppelin.k8s.server.uid}}
        {% endif %}
      subjects:
      - kind: ServiceAccount
        name: {{zeppelin.k8s.interpreter.serviceAccount}}
      roleRef:
        kind: Role
        name: {{zeppelin.k8s.interpreter.pod.name}}
        apiGroup: rbac.authorization.k8s.io
      {% if zeppelin.k8s.spark.useIngress is defined and zeppelin.k8s.spark.useIngress == "true" %}
      ---
      # create ingress of spark UI
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            kubernetes.io/ingress.class: nginx
            kubernetes.io/tls-acme: "true"
        name: spark-ui-{{zeppelin.k8s.interpreter.pod.name}}
        namespace: {{zeppelin.k8s.interpreter.namespace}}
        {% if zeppelin.k8s.server.uid is defined %}
        ownerReferences:
        - apiVersion: v1
          controller: false
          blockOwnerDeletion: false
          kind: Pod
          name: {{zeppelin.k8s.server.pod.name}}
          uid: {{zeppelin.k8s.server.uid}}
        {% endif %}
      spec:
        rules:
        - host: {{zeppelin.k8s.spark.ingress.host}}
          http:
            paths:
            - pathType: Prefix
              path: "/"
              backend:
                service:
                  name: {{zeppelin.k8s.interpreter.pod.name}}
                  port:
                    number: 4040
        tls:
        - hosts:
          - {{zeppelin.k8s.spark.ingress.host}}
      {% endif %}
      {% endif %}
    `}}

  shiro.ini: |
    [users]
    dataOps = Tz44828IX60O, admin

    [main]
    sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
    cookie = org.apache.shiro.web.servlet.SimpleCookie
    cookie.name = JSESSIONID
    cookie.httpOnly = true
    sessionManager.sessionIdCookie = $cookie
    securityManager.sessionManager = $sessionManager
    securityManager.sessionManager.globalSessionTimeout = 86400000
    shiro.loginUrl = /api/login
    [roles]
    admin = *
    [urls]
    /api/version = anon
    /api/cluster/address = anon
    /api/interpreter/setting/restart/** = authc
    /api/interpreter/** = authc, roles[admin]
    /api/notebook-repositories/** = authc, roles[admin]
    /api/configurations/** = authc, roles[admin]
    /api/credential/** = authc, roles[admin]
    /api/admin/** = authc, roles[admin]
    /** = authc




      

