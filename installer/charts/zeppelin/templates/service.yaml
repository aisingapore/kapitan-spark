apiVersion: v1
kind: Service
metadata:
  name: {{ include "zeppelin.fullname" . }}
  namespace: {{ .Release.Namespace }} 
  labels:
    {{- include "zeppelin.labels" $ | trim | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations: 
          {{- with .Values.service.annotations }}
              {{- toYaml . | nindent 4 }}
          {{- end }}
  {{- end }}
spec:
    {{- if .Values.service.clusterIP }}
    clusterIP: {{ .Values.service.clusterIP }}
    {{- end}}
    ports:
        -   name: http
            port: 8080
            protocol: TCP
            {{- if eq .Values.service.type "NodePort" }}
            nodePort: {{ required "Node Port number for zeppelin is required" .Values.service.nodePortJupyterlabPort }}
            {{- end }}
        - port: 8443
          targetPort: https
          protocol: TCP
          name: https
        - port: 12320 # port name is referenced in the code. So it shouldn't be changed.
          name: rpc
    selector:
        name: {{ include "zeppelin.fullname" . }}
    type: {{ required "Service type is required" .Values.service.type }}


